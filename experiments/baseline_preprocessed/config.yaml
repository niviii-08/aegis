# AEGIS baseline training configuration for preprocessed dataset
# Training on 26 samples (13 real FFHQ + 13 fake StyleGAN)

version: "1.0.0"

split:
  split_dir: experiments/baseline_preprocessed/splits
  split_version: "1.0.0" 
  preprocessing_version: "1.0.0"
  metadata_path: data/processed/image/preprocessing/metadata.csv

data:
  input_source: normalized_npy
  num_workers: 0
  pin_memory: false

model:
  backbone: efficientnet_b4
  pretrained: true
  dropout: 0.2
  input_size: 224

training:
  seed: 42
  batch_size: 4  # Small batch size for small dataset
  epochs: 20     # More epochs for small dataset
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  optimizer: adamw
  scheduler: cosine
  scheduler_min_lr: 1.0e-6
  early_stopping:
    enabled: true
    patience: 10  # Higher patience for small dataset
    monitor: val_roc_auc
    mode: max
  mixed_precision: false  # Disable for CPU training
  class_weighting: false  # Balanced dataset
  class_imbalance_threshold: 0.05

evaluation:
  threshold: 0.5
  splits:
    - val
    - test_seen

outputs:
  checkpoint_dir: experiments/baseline_preprocessed/checkpoints
  report_dir: experiments/baseline_preprocessed/reports
  results_path: experiments/baseline_preprocessed/results.json

logging:
  experiment_name: aegis-baseline-preprocessed
  mlflow_tracking_uri: experiments/baseline_preprocessed/mlruns
  use_mlflow: false  # Disable for simplicity