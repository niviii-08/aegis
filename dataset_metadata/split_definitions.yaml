# AEGIS Split Definitions
# Defines which generators are used for each split in generalization experiments

version: "1.0"
seed: 42

# Image Modality Splits
image:
  seen_generators:
    - ffhq_authentic  # Real images from FFHQ
    - stylegan        # Fake images from StyleGAN
    # Future: Add FaceForensics++ generators
    # - DeepFakes
    # - Face2Face
  
  unseen_generators:
    # Currently empty - this is the CRITICAL BLOCKER
    # Future: Use FaceForensics++ generators
    # - FaceSwap
    # - NeuralTextures
  
  split_ratios:
    train: 0.70
    validation: 0.15
    seen_test: 0.15
    unseen_test: 1.00  # All unseen data goes to unseen_test

# Audio Modality Splits  
audio:
  seen_generators:
    - bonafide        # Real audio
    # Future: ASVspoof attacks subset
    # - A01
    # - A02
    # - A03
    # - A04
    # - A05
    # - A06
    # - A07
  
  unseen_generators:
    # Future: ASVspoof attacks subset
    # - A08
    # - A09
    # - A10
    # - A11
    # - A12
    # - A13
    # - A14
    # - A15
    # - A16
    # - A17
    # - A18
    # - A19
  
  split_ratios:
    train: 0.70
    validation: 0.15
    seen_test: 0.15
    unseen_test: 1.00

# Video Modality Splits
video:
  seen_generators:
    # Future: FaceForensics++ generators
    # - original       # Real videos
    # - DeepFakes
    # - Face2Face
  
  unseen_generators:
    # Future: FaceForensics++ + Celeb-DF
    # - FaceSwap
    # - NeuralTextures
    # - CelebDF
  
  split_ratios:
    train: 0.70
    validation: 0.15
    seen_test: 0.15
    unseen_test: 1.00

# Split Assignment Rules
rules:
  # Identity leakage prevention
  prevent_identity_leakage: true
  identity_columns:
    image: identity_key
    audio: speaker_id
    video: video_id
  
  # Duplicate detection
  detect_duplicates: true
  duplicate_method: file_hash
  
  # Class balance
  ensure_class_balance: true
  balance_method: stratified
  
  # Deterministic splitting
  deterministic: true
  random_seed: 42