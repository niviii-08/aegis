# Forgetting-risk prediction — reproducible training configuration
seed: 42
dataset_version: "1.0.0"

paths:
  data_dir: ml/data/generated
  artifact_dir: ml/artifacts/forgotting_risk

dataset:
  n_users: 400
  n_items: 80
  n_days: 180
  reviews_per_user_mean: 45
  retention_horizon_days: 7
  random_seed: 42

splits:
  # Time-aware global split on event_timestamp (not random row shuffle)
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15

features:
  numeric:
    - interval_since_last_review_hours
    - log_interval_since_last_review
    - cumulative_reviews
    - rolling_accuracy_5
    - rolling_accuracy_10
    - item_difficulty
    - session_index
    - hour_of_day_sin
    - hour_of_day_cos
    - day_of_week_sin
    - day_of_week_cos
  categorical:
    - modality_tag
  # Explicit deny-list: must never enter the model (target leakage)
  forbidden:
    - will_forget
    - user_id
    - item_id
    - event_timestamp
    - next_review_timestamp
    - future_recall_success
    - label_horizon_end

models:
  baseline:
    type: logistic_regression
    params:
      max_iter: 2000
      class_weight: balanced
      C: 1.0
  xgboost:
    type: xgboost
    params:
      n_estimators: 300
      max_depth: 5
      learning_rate: 0.05
      subsample: 0.85
      colsample_bytree: 0.85
      min_child_weight: 3
      reg_lambda: 1.0
      scale_pos_weight: auto
      eval_metric: logloss
      random_state: 42
      n_jobs: -1

training:
  primary_model: xgboost
  cv_folds: 5
  use_time_series_cv: true
  calibrate: true
  calibration_method: isotonic
  quick_mode: false

evaluation:
  # Default fallback; training selects threshold on validation (max F1).
  threshold: 0.5
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - roc_auc
    - pr_auc

shap:
  enabled: true
  max_background_samples: 200
  individual_example_index: 0
